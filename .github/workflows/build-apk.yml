name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Arrange files
        run: |
          mkdir -p assets www/mocks
          cp -n icon-*.png assets/ 2>/dev/null || true
          cp -n index.html www/index.html 2>/dev/null || true
          cp -n mock*.html www/mocks/ 2>/dev/null || true
          ls -R www assets

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add Gemma native plugin
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR=android/app/src/main/java/$(echo "$APPID" | tr . /)
          mkdir -p "$DIR"
          SRC=GemmaPlugin.java
          [ -f native/GemmaPlugin.java ] && SRC=native/GemmaPlugin.java
          sed -E "s/^package .*;/package $APPID;/" "$SRC" > "$DIR/GemmaPlugin.java"
          cat > "$DIR/MainActivity.java" <<JAVA
          package $APPID;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(GemmaPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i "0,/^dependencies {/s//dependencies {\n    implementation 'com.google.mediapipe:tasks-genai:0.10.24'/" android/app/build.gradle
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          sed -i 's/<application/<application android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml
          grep -n "mediapipe" android/app/build.gradle
          grep -n "minSdk" android/variables.gradle
          head -3 "$DIR/GemmaPlugin.java"

      - name: Upgrade Gradle for Java 21
        run: sed -i 's#gradle-8.2.1-all.zip#gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEET-PYQ-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
