<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>NEET PYQ + Mock Test App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 24px; margin-bottom: 6px; }
  header p { color: #cfd8dc; font-size: 13px; }
  .cards { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 18px 20px;
    backdrop-filter: blur(6px);
  }
  .card-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: #b0bec5; margin-bottom: 14px; }
  .btn-col { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: block; width: 100%; text-align: center;
    padding: 12px 14px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-paper { background: #2e86de; color: #fff; }
  .btn-key   { background: #10ac84; color: #fff; }
  .btn-mock  { background: #ff6b35; color: #fff; }
  footer { text-align: center; margin-top: 26px; font-size: 12px; color: #90a4ae; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92); z-index: 100;
    align-items: center; justify-content: center; padding: 10px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    width: 100%; max-width: 900px; height: 92vh;
    background: #111; border-radius: 10px; overflow: hidden;
    position: relative; display: flex; flex-direction: column;
  }
  .modal-box.fullscreen { max-width: 100%; height: 100vh; border-radius: 0; }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: #1a1a1a; font-size: 14px; gap: 10px;
  }
  .modal-header span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .close-btn {
    background: #ff4757; color: #fff; border: none; border-radius: 6px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .modal-body { flex: 1; position: relative; background: #000; }
  iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #90a4ae; font-size: 13px; }

#cbFab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;border:none;background:#8e44ad;color:#fff;font-size:26px;z-index:90;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer}

header{padding:0 46px}

<script>

  const tests = [
    {
      title: "NEET 2026 — 21 June",
      sub: "Question Paper + Answer Key + Mock Test",
      paperId: "1WXtr3rSufGkZxAmcjQiguoEj2nT2-d9G",
      keyId: "1ZzFdWtVN_hv1IvWSEg54t8nUfIW2Xq0d",
      mockDataId: "mock0"
    },
    {
      title: "NEET 2026 — 3 May",
      sub: "Question Paper + Answer Key + Mock Test",
      paperId: "17jJlXG5hqn3sdAsFVBdPYGNgFzuHCDXZ",
      keyId: "1Bcd8K-p5WtbDUne1LfPmR3WIaCDjV2Wc",
      mockDataId: "mock1"
    },
    {
      title: "NEET 2025 — 4 May",
      sub: "Question Paper + Answer Key + Mock Test",
      paperId: "1WrWJbPw3chGgvNuLuTZZCjNY1DVrnkM1",
      keyId: "1Trkp0UlDZZ50UfoPmHkwvyNrsK1CwNG1",
      mockDataId: "mock2"
    },
    {
      title: "NEET 2024 — 5 May",
      sub: "Question Paper + Answer Key + Mock Test",
      paperId: "105BHs34lvwdhDOjvblGbBd_tez148rmN",
      keyId: "1QMZO-Hb-WLfoLfwaxQBSHXssqBuYzX0w",
      mockDataId: "mock3"
    }
  ];


  const container = document.getElementById('cardContainer');
  const overlay = document.getElementById('modalOverlay');
  const modalBox = document.getElementById('modalBox');
  const frame = document.getElementById('viewerFrame');
  const modalTitle = document.getElementById('modalTitle');
  const loadingMsg = document.getElementById('loadingMsg');
  const closeBtn = document.getElementById('closeBtn');

  function drivePreviewLink(fileId) {
    return `https://drive.google.com/file/d/${fileId}/preview`;
  }

  // Google Drive app ko force open karne ke liye Android intent link banata hai
  function driveAppLink(fileId) {
    const fallback = encodeURIComponent(`https://drive.google.com/file/d/${fileId}/view?usp=drivesdk`);
    return `intent://drive.google.com/file/d/${fileId}/view#Intent;package=com.google.android.apps.docs;scheme=https;S.browser_fallback_url=${fallback};end`;
  }

  function openInDriveApp(fileId) {
    window.location.href = 'https://drive.google.com/file/d/' + fileId + '/view?usp=drivesdk';
  }

  function openPdfViewer(title, url) {
    modalBox.classList.remove('fullscreen');
    modalTitle.textContent = title;
    loadingMsg.style.display = 'block';
    frame.removeAttribute('srcdoc');
    frame.src = url;
    overlay.classList.add('active');
  }

  async function openMockViewer(title, dataId, replay) {
    window.curTest = {title: title.replace(/ — Mock Test$/, ''), dataId};
    modalBox.classList.add('fullscreen');
    modalTitle.textContent = title;
    loadingMsg.style.display = 'block';
    frame.src = 'about:blank';
    overlay.classList.add('active');
    try {
      const raw = await (await fetch('mocks/' + dataId + '.html')).text();
      frame.srcdoc = injectHook(raw, replay);
    } catch (e) {
      loadingMsg.textContent = 'Test load nahi hua: ' + e;
    }
  }

  frame.addEventListener('load', () => { loadingMsg.style.display = 'none'; });

  function closeViewer() {
    overlay.classList.remove('active');
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';
    modalBox.classList.remove('fullscreen');
  }

  closeBtn.addEventListener('click', closeViewer);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeViewer(); });

  tests.forEach((t) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-title">${t.title}</div>
      <div class="card-sub">${t.sub}</div>
      <div class="btn-col">
        <button class="btn btn-paper">📄 Question Paper</button>
        <button class="btn btn-key">✅ Answer Key</button>
        <button class="btn btn-mock">🖥️ Start Mock Test</button>
      </div>
    `;
    const [paperBtn, keyBtn, mockBtn] = card.querySelectorAll('.btn');
    paperBtn.addEventListener('click', () => openInDriveApp(t.paperId));
    keyBtn.addEventListener('click', () => openInDriveApp(t.keyId));
    mockBtn.addEventListener('click', () => openMockViewer(t.title + ' — Mock Test', t.mockDataId));
    container.appendChild(card);
  });
</script>

<script>
const CB=JSON.parse(document.getElementById('cbData').textContent), PN=CB.papers;
const QS=CB.q.map(r=>{const m=r[3].split(/\n?\s*(?:Ans\.?|Answer)\s*[:(]/);return {p:r[0],n:r[1],subj:r[2],txt:m[0].trim(),sol:r[3].slice(m[0].length).trim(),ans:r[4]};});
const qk=q=>q.p+'-'+q.n;
let needKey=false, busy=false;
const cbM=document.getElementById('cbMsgs'), cbIn=document.getElementById('cbIn');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
function msg(cls,html){const d=document.createElement('div');d.className='cbm '+cls;d.innerHTML=html;cbM.appendChild(d);cbM.scrollTop=cbM.scrollHeight;return d;}
const bot=h=>msg('bot',h), usr=t=>msg('usr',esc(t));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const STATIC=['gemini-3.8-flash','gemini-3.5-flash','gemini-3.5-flash-lite'];
let MODELS=null, usedModel='';
async function getModels(k){
  if(MODELS) return MODELS;
  let found=[];
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':k}});
    if(r.ok){
      const d=await r.json();
      found=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/','')).filter(n=>/^gemini-([3-9]|\d{2,})(\.\d+)?-flash(-lite)?$/.test(n));
      const ver=n=>parseFloat(n.match(/gemini-([\d.]+)/)[1]);
      found.sort((x,y)=>ver(y)-ver(x)||(/lite/.test(x)-/lite/.test(y)));
    }
  }catch(e){}
  let list=[...new Set([...found,...STATIC])];
  const last=localStorage.getItem('cbModel');
  if(last&&/^gemini-[3-9]/.test(last)&&list.includes(last)) list=[last,...list.filter(x=>x!==last)];
  return MODELS=list;
}
async function gem(prompt,json){
  const k=localStorage.getItem('cbKey'); if(!k) throw new Error('API key nahi hai');
  const ms=await getModels(k); let last='';
  for(const m of ms){
    for(let t=0;t<2;t++){
      try{
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:json?{responseMimeType:'application/json'}:{}})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok){
          const em=d.error?.message||('HTTP '+r.status);
          if(/API key not valid|API_KEY_INVALID|API key expired|invalid authentication|UNAUTHENTICATED/i.test(em)){const e=new Error('API key galat hai. ⚙️ dabake sahi key daalo.');e.fatal=true;throw e;}
          last=m+': '+em;
          if(r.status===429&&t===0){await sleep(4000);continue;}
          break;
        }
        const text=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
        if(!text){last=m+': khali jawab';break;}
        if(json){try{JSON.parse(text);}catch(e){last=m+': JSON galat';break;}}
        usedModel=m; localStorage.setItem('cbModel',m);
        return text;
      }catch(e){if(e.fatal) throw e; last=m+': '+e.message; break;}
    }
  }
  MODELS=null;
  throw new Error('Saare models try kar liye, jawab nahi aaya. Aakhri error: '+last);
}

async function askG(text){
  if(busy) return; usr(text);
  if(needKey||!localStorage.getItem('cbKey')){const k=text.replace(/\s/g,'');if(!/^(AIza|AQ\.)[\w.-]{25,}$/.test(k)){needKey=true;return bot('Please paste a valid Gemini API key. It starts with <b>AIza</b> or <b>AQ.</b>. Get one free at aistudio.google.com/apikey');}localStorage.setItem('cbKey',k);needKey=false;return bot('API key saved. You can ask your question now.');}
  busy=true; const st=bot('Sawal dhundh raha hoon…');
  try{
    const list=QS.map(q=>`${qk(q)}|${q.subj}|${q.txt.replace(/\s+/g,' ').slice(0,170)}`).join('\n');
    const p=JSON.parse(await gem(`Tum NEET PYQ search assistant ho. Papers (paper-index: naam): ${PN.map((n,i)=>i+': '+n).join('; ')}. Sirf yehi papers available hain; NEET 2026 (3 May) aur NEET 2025 ka data nahi hai.
User ka sawal: "${text}"
Neeche sawalon ki list hai (format: id|subject|text). Jo sawal user ke topic/chapter se sach mein match karte hain (aur agar user ne paper/year bataya to sirf us paper ke) unki id do, zyada se zyada 8. Agar user ne wo paper manga jo available nahi hai to ids khali rakho aur "chat" mein Hinglish mein batao. Agar sawal NEET papers se related hi nahi hai to bhi "chat" mein chhota jawab do.
JSON do: {"ids":["0-12"],"chat":""}
${list}`,true));
    const hit=(p.ids||[]).map(id=>QS.find(q=>qk(q)===id)).filter(Boolean).slice(0,8);
    if(!hit.length){st.innerHTML=esc(p.chat||'Is topic ka koi sawal in papers mein nahi mila.');return;}
    st.innerHTML=`<b>${hit.length} sawal mile:</b> <small>(model: ${usedModel})</small>`;
    hit.forEach(q=>bot(`<b>${PN[q.p]}</b> · Q${q.n} · <small>${q.subj}</small><div class="qt">${esc(q.txt)}</div>`));
    const b=bot('Kya aap inka answer jaanna chahte hain?<div class="yn"><button>✅ Yes</button><button>❌ No</button></div>');
    const [y,n]=b.querySelectorAll('button');
    y.onclick=()=>{b.querySelector('.yn').remove();usr('Yes');reveal(hit);};
    n.onclick=()=>{b.querySelector('.yn').remove();usr('No');bot('Okay. Let me know if you have another question.');};
  }catch(e){st.innerHTML='⚠️ '+esc(e.message)+'<br><small>Key galat ho to ⚙️ dabake dobara daalo.</small>';}
  finally{busy=false;}
}

async function reveal(hit){
  const lines=hit.map(q=>`${PN[q.p]} · Q${q.n}: <b>Sahi answer: Option ${q.ans}</b>`);
  const st=bot(lines.join('<br>')+'<hr><small>Explanation bana raha hoon…</small>');
  try{
    const items=hit.map(q=>`Q${q.n} (${PN[q.p]}):\n${q.txt}\nSahi option: ${q.ans}\n${q.sol.slice(0,600)}`).join('\n\n');
    const ex=await gem(`Har sawal ke liye 2-3 line ka simple Hinglish explanation do, format "Q<no>: ...". Diya gaya sahi option badalna mat. Sawal ka text OCR se hai, kuch symbol/diagram galat ya missing ho sakte hain.\n\n${items}`);
    st.innerHTML=lines.join('<br>')+'<hr>'+esc(ex);
  }catch(e){st.innerHTML=lines.join('<br>')+'<br><small>Explanation nahi aa saka: '+esc(e.message)+'</small>';}
  cbM.scrollTop=cbM.scrollHeight;
}

const panel=document.getElementById('cbPanel');
document.getElementById('cbFab').onclick=()=>{panel.classList.add('on');if(!cbM.children.length)bot(localStorage.getItem('cbKey')?'Hello! I can help you find and understand questions from Re-NEET 2026, Re-NEET 2024 and NEET 2024. Try: <i>Which question on Animal Kingdom came in Re-NEET 2026?</i>':'Hello! To get started, open <b>Settings</b> (gear icon above) and add your Gemini API key (free at aistudio.google.com/apikey).');};
document.getElementById('cbX').onclick=()=>panel.classList.remove('on');
document.getElementById('cbKey').onclick=()=>{needKey=true;bot('Paste your new Gemini API key and send it.');};
const go=()=>{const t=cbIn.value.trim();if(t){cbIn.value='';ask(t);}};
document.getElementById('cbSend').onclick=go; cbIn.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
<script>
/* ===== OFFLINE GEMMA 3 1B (MediaPipe LLM) =====
   Offline chalane ke liye genai_bundle.mjs + wasm folder apne app ke assets mein rakho aur neeche path badlo,
   e.g. MP_JS='./mediapipe/genai_bundle.mjs', MP_WASM='./mediapipe/wasm' */
const MP_JS='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@latest/genai_bundle.mjs';
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@latest/wasm';
const IS_APP=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())||(location.protocol==='https:'&&location.hostname==='localhost');
try{const bk=localStorage.getItem('cbKey');if(bk&&!/^(AIza|AQ\.)[\w.-]{25,}$/.test(bk))localStorage.removeItem('cbKey');}catch(e){}

let llm=null, loadingLLM=false;
const cbSt=document.getElementById('cbSt'), cbFile=document.getElementById('cbFile');
const setSt=t=>cbSt.textContent=t;
setSt('Offline AI: model not loaded');

const APPINFO='App ka naam: NEET PYQ + Mock Test App. Tests: '+tests.map(t=>t.title).join('; ')+'. Har test ke 3 button hain: Question Paper (Google Drive app mein khulta hai), Answer Key (Drive app mein), Start Mock Test (app ke andar fullscreen mein khulta hai, upar Close button se band hota hai). Chatbot (chat button, neeche right) in papers ke sawal topic se dhundta hai: '+PN.join('; ')+'. Sawal milne par Yes dabao to sahi answer aur explanation milta hai. NEET 2026 (3 May) aur NEET 2025 ke chatbot-sawal available nahi hain. 📦 se Gemma offline model load hota hai, ⚙️ se Gemini API key.';

async function opfs(){return navigator.storage.getDirectory();}
async function saveModel(f){try{const h=await (await opfs()).getFileHandle('gemma.task',{create:true});await f.stream().pipeTo(await h.createWritable());return true;}catch(e){return false;}}
async function storedModel(){try{const f=await (await (await opfs()).getFileHandle('gemma.task')).getFile();return f.size>1e8?f:null;}catch(e){return null;}}
async function loadLLM(f){
  if(loadingLLM) return; loadingLLM=true; setSt('⏳ Gemma load ho raha hai… (1-2 min lag sakta hai)');
  try{
    if(!navigator.gpu) throw new Error('Is device/browser mein WebGPU nahi hai');
    let m,g;
    try{m=await import('./mediapipe/genai_bundle.mjs');g=await m.FilesetResolver.forGenAiTasks('./mediapipe/wasm');}
    catch(e1){m=await import(MP_JS);g=await m.FilesetResolver.forGenAiTasks(MP_WASM);}
    llm=await m.LlmInference.createFromOptions(g,{baseOptions:{modelAssetBuffer:f.stream().getReader()},maxTokens:2048,topK:40,temperature:0.6,randomSeed:7});
    setSt('✅ Offline AI ready — Gemma 3 1B');
  }catch(e){llm=null;setSt('⚠️ Model load fail: '+e.message);}
  loadingLLM=false;
}
document.getElementById('cbMod').onclick=()=>cbFile.click();
cbFile.onchange=async()=>{const f=cbFile.files[0];if(!f)return;setSt('💾 Model save ho raha hai…');const ok=await saveModel(f);await loadLLM(f);if(llm&&!ok)setSt('✅ Ready, par save nahi hua — agli baar dobara select karna padega');};
document.getElementById('cbFab').addEventListener('click',async()=>{if(llm||loadingLLM)return;const f=await storedModel();if(f)loadLLM(f);});

async function gma(prompt,d){
  let t='';
  await llm.generateResponse(`<start_of_turn>user\n${prompt}<end_of_turn>\n<start_of_turn>model\n`,(x)=>{t+=x;d.innerHTML=esc(t);cbM.scrollTop=cbM.scrollHeight;});
  return t;
}

/* ===== Local (offline) search over PYQ data ===== */
const SW=new Set('the and for with this that kya hai hain mein se ka ki ke ko ne par aur jo konsa konse kaun kaise sawal question paper neet pyq batao bata dikhao aaya aaye wala wale which what from are was'.split(' '));
const tok=s=>(String(s).toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).filter(w=>w.length>2&&!SW.has(w)&&!/^20\d\d$/.test(w));
const DOC=QS.map(q=>new Set(tok(q.subj+' '+q.txt))), DF={};
DOC.forEach(d=>d.forEach(w=>DF[w]=(DF[w]||0)+1));
const idf=w=>Math.log(1+QS.length/(DF[w]||0.5));
function search(text){
  const qt=[...new Set(tok(text))]; if(!qt.length) return [];
  const yrs=text.match(/20\d\d/g)||[], re=/re-?neet/i.test(text), r=[];
  QS.forEach((q,i)=>{
    if(yrs.length&&!yrs.some(y=>PN[q.p].includes(y))) return;
    if(re&&!/re-neet/i.test(PN[q.p])) return;
    let s=0,m=0; qt.forEach(w=>{if(DOC[i].has(w)){s+=idf(w);m++;}});
    if(m) r.push({q,s,m});
  });
  r.sort((a,b)=>b.s-a.s);
  const need=qt.length>1?2:1;
  return r.filter(x=>x.m>=need&&x.s>=r[0].s*0.6).slice(0,8).map(x=>x.q);
}

async function localAsk(text){
  usr(text); busy=true;
  try{
    const hit=search(text);
    if(!hit.length){
      if(!llm){bot('Please load the offline model using the download icon above to get offline answers.');return;}
      const d=bot('…');
      await gma(`Tum NEET PYQ app ke offline assistant ho. Sirf neeche di gayi app ki jankari se Hinglish mein chhota jawab do. Jankari na ho to bolo "Ye mujhe app mein nahi mila".\n\nAPP: ${APPINFO}\n\nUser: ${text}`,d);
      return;
    }
    bot(`<b>${hit.length} sawal mile:</b> <small>(offline)</small>`);
    hit.forEach(q=>bot(`<b>${PN[q.p]}</b> · Q${q.n} · <small>${q.subj}</small><div class="qt">${esc(q.txt)}</div>`));
    const b=bot('Kya aap inka answer jaanna chahte hain?<div class="yn"><button>✅ Yes</button><button>❌ No</button></div>');
    const [y,n]=b.querySelectorAll('button');
    y.onclick=()=>{b.querySelector('.yn').remove();usr('Yes');revealL(hit);};
    n.onclick=()=>{b.querySelector('.yn').remove();usr('No');bot('Okay. Let me know if you have another question.');};
  }catch(e){bot('⚠️ '+esc(e.message));}
  finally{busy=false;}
}
async function revealL(hit){
  const lines=hit.map(q=>`${PN[q.p]} · Q${q.n}: <b>Sahi answer: Option ${q.ans}</b>`);
  const d=bot(lines.join('<br>'));
  if(!llm){d.innerHTML+='<hr>'+hit.slice(0,3).map(q=>`<small>Q${q.n}: ${esc(q.sol.slice(0,300))}</small>`).join('<br>');return;}
  busy=true;
  try{
    const items=hit.slice(0,3).map(q=>`Q${q.n}:\n${q.txt.replace(/\s+/g,' ').slice(0,300)}\nSahi option: ${q.ans}\n${q.sol.replace(/\s+/g,' ').slice(0,250)}`).join('\n\n');
    d.innerHTML=lines.join('<br>')+'<hr><small>Explanation bana raha hoon…</small>';
    const e=bot('…');
    await gma(`Har sawal ke liye 2 line ka simple Hinglish explanation do, format "Q<no>: ...". Sahi option badalna mat. Text OCR se hai, kuch galat ho sakta hai.\n\n${items}`,e);
  }catch(e){d.innerHTML+='<br><small>Explanation nahi aa saka: '+esc(e.message)+'</small>';}
  finally{busy=false;}
}

/* ===== Router: app ke sawal -> offline Gemma, baaki -> Gemini ===== */
const APPRX=/\b(neet|re-?neet|paper|pyq|answer key|mock|test|sawal|sawaal|question|prashn|app|chatbot|option|chapter)\b|\bq\s?\d+|20\d\d/i;
async function outAsk(text){
  busy=true; const st=bot('Gemini se pooch raha hoon…');
  try{
    const a=await gem('Tum ek helpful assistant ho. Simple Hinglish mein, chhota aur sahi jawab do.\n\nSawal: '+text);
    st.innerHTML=esc(a)+`<br><small>(Gemini: ${usedModel})</small>`;
  }catch(e){st.innerHTML='⚠️ '+esc(e.message);}
  finally{busy=false;}
}
function ask(text){
  if(busy) return;
  if(needKey) return askG(text);
  const k=localStorage.getItem('cbKey'), on=navigator.onLine;
  if(!APPRX.test(text)){
    usr(text);
    if(!on) return void bot('Ye app ke bahar ka sawal hai — iske liye internet chahiye 🌐');
    if(!k) return void bot('Is sawal ke liye Gemini API key chahiye. ⚙️ dabake key daalo.');
    return outAsk(text);
  }
  if(!llm&&on&&k) return askG(text);
  return localAsk(text);
}
</script>
<script>
/* ===== TEST RECORD (hamburger menu) ===== */
function hookFn(R){
  var A=typeof state!=='undefined';
  function replay(){
    if(A){Object.assign(state.responses,R.responses);state.lang=R.lang||state.lang;document.getElementById('startScreen').classList.add('hidden');state.submitted=true;computeAndShowResult();}
    else{Object.assign(responses,R.responses);document.getElementById('start-screen').style.display='none';submitTest();}
  }
  function collect(){
    var o={responses:JSON.parse(JSON.stringify(A?state.responses:responses)),wrongQs:[],skippedQs:[],subj:[]};
    if(A){
      var d=scoreData;
      o.lang=state.lang;o.score=d.total;o.correct=d.correct;o.wrong=d.wrong;o.skipped=d.skipped;
      o.max=Object.keys(d.perQ).length*4;o.used=DURATION_SECONDS-state.timeLeft;
      for(var q in d.perQ){var s=d.perQ[q].status;if(s==='wrong')o.wrongQs.push(+q);else if(s==='skipped')o.skippedQs.push(+q);}
      for(var k in d.subjStats)o.subj.push([k,d.subjStats[k].marks]);
    }else{
      var g=function(i){return document.getElementById(i).textContent;};
      o.score=+g('final-score');o.correct=+g('stat-correct');o.wrong=+g('stat-wrong');o.skipped=+g('stat-skipped');
      o.max=QUESTIONS.length*4;o.used=TOTAL_TIME_SECONDS-timeLeft;
      QUESTIONS.forEach(function(q){var v=isCorrect(q);if(v==='wrong')o.wrongQs.push(q.id);else if(v==='skipped')o.skippedQs.push(q.id);});
      o.subj=[['Physics',+g('stat-physics')],['Chemistry',+g('stat-chemistry')],['Biology',+g('stat-biology')]];
    }
    return o;
  }
  var fn=A?'computeAndShowResult':'submitTest', orig=window[fn];
  window[fn]=function(){
    var r=orig.apply(this,arguments);
    if(!R){try{parent.postMessage({neetAttempt:collect()},'*');}catch(e){}}
    return r;
  };
  if(R)replay();
}
function injectHook(html,replay){
  const tag='<script>('+hookFn.toString()+')('+JSON.stringify(replay||null).replace(/</g,'\\u003c')+')<\/script>';
  const i=html.lastIndexOf('</body>');
  return i<0?html+tag:html.slice(0,i)+tag+html.slice(i);
}
const HK='neetHist';
const histGet=()=>{try{return JSON.parse(localStorage.getItem(HK)||'[]');}catch(e){return [];}};
const histSet=h=>{try{localStorage.setItem(HK,JSON.stringify(h));}catch(e){}};
window.addEventListener('message',e=>{
  const a=e.data&&e.data.neetAttempt;
  if(!a||e.source!==frame.contentWindow||!window.curTest) return;
  const h=histGet(); h.unshift({...a,ts:Date.now(),title:curTest.title,dataId:curTest.dataId}); histSet(h);
});
const hmDr=document.getElementById('hmDr'), hmOv=document.getElementById('hmOv'), hmList=document.getElementById('hmList');
function renderHist(){
  const h=histGet();
  document.getElementById('hmClr').style.display=h.length?'':'none';
  if(!h.length){hmList.innerHTML='<p class="hmE">Abhi koi test submit nahi hua.<br>Mock test submit karte hi uska poora record yahan aa jayega.</p>';return;}
  const qs=a=>a.length?a.map(q=>'Q'+q).join(', '):'koi nahi 🎉';
  hmList.innerHTML=h.map((a,i)=>`<div class="hmC"><div class="hmT">${esc(a.title)}</div>
<div class="hmD">${new Date(a.ts).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})} • ${Math.round((a.used||0)/60)} min</div>
<div class="hmS"><b>${a.score}</b> / ${a.max} marks</div>
<div class="hmCh"><span>✅ ${a.correct} sahi</span><span>❌ ${a.wrong} galat</span><span>⏭️ ${a.skipped} skip</span></div>
<div class="hmS">${a.subj.map(s=>esc(s[0])+': <b style="font-size:13px;color:#fff">'+s[1]+'</b>').join(' • ')}</div>
<div class="hmQ"><b>❌ Galat:</b> ${qs(a.wrongQs)}</div>
<div class="hmQ"><b>⏭️ Skip:</b> ${qs(a.skippedQs)}</div>
<div class="hmB"><button data-o="${i}">📄 Poora Result dekho</button><button data-d="${i}">🗑️</button></div></div>`).join('');
}
function hmShow(on){hmDr.classList.toggle('on',on);hmOv.classList.toggle('on',on);if(on)renderHist();}
document.getElementById('hmBtn').onclick=()=>hmShow(true);
document.getElementById('hmX').onclick=hmOv.onclick=()=>hmShow(false);
document.getElementById('hmClr').onclick=()=>{if(confirm('Saara test record delete ho jayega. Pakka?')){histSet([]);renderHist();}};
hmList.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const h=histGet();
  if(b.dataset.d!==undefined){if(confirm('Ye record delete karein?')){h.splice(+b.dataset.d,1);histSet(h);renderHist();}}
  else if(b.dataset.o!==undefined){const a=h[+b.dataset.o];hmShow(false);openMockViewer(a.title+' — Result',a.dataId,a);}
});
</script>
